name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Addons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (all packages)
        run: pnpm run type-check

      - name: Run unit tests (all packages)
        run: pnpm test

      - name: Package all addons (.zip)
        run: pnpm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/dividends-projection-addon/dist/dividends-projection-addon.zip
            packages/portfolio-metrics-addon/dist/portfolio-metrics-addon.zip
            packages/monthly-performance-addon/dist/monthly-performance-addon.zip
            packages/assets-performance-addon/dist/assets-performance-addon.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
