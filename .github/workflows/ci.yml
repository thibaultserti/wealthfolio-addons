name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint check
        run: pnpm run lint

  build-and-test:
    name: Test & Package (${{ matrix.addon.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - name: dividends-projection-addon
            package: wealthfolio-dividend-projection-addon
            path: packages/dividends-projection-addon
            zip: dividends-projection-addon.zip
          - name: portfolio-metrics-addon
            package: wealthfolio-portfolio-metrics-addon
            path: packages/portfolio-metrics-addon
            zip: portfolio-metrics-addon.zip
          - name: monthly-performance-addon
            package: wealthfolio-monthly-performance-addon
            path: packages/monthly-performance-addon
            zip: monthly-performance-addon.zip
          - name: assets-performance-addon
            package: wealthfolio-assets-performance-addon
            path: packages/assets-performance-addon
            zip: assets-performance-addon.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter ${{ matrix.addon.package }} run type-check

      - name: Run unit tests
        run: pnpm --filter ${{ matrix.addon.package }} run test

      - name: Package addon (.zip)
        run: pnpm --filter ${{ matrix.addon.package }} run package

      - name: Upload addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.addon.name }}
          path: ${{ matrix.addon.path }}/dist/${{ matrix.addon.zip }}
          retention-days: 7
